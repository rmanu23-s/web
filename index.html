<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Bad Bunny - Inicio</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>

  <!-- ================= NAVBAR ================= -->
  <header class="main-header">
    <nav class="navbar">
      <ul>
        <li><a class="active" href="index.html">INICIO</a></li>
        <li><a href="biografia.html">BIOGRAFÍA</a></li>
        <li><a href="merch.html">MERCH</a></li>
        <li><a href="discografia.html">DISCOGRAFÍA</a></li>
      </ul>
    </nav>
  </header>

  <!-- ================= HERO MOSCOW MULE ================= -->
  <main>

    <section class="hero">
      <!-- imagen completa del fondo con el texto MOSCOW MULE incluido -->
      <img
        src="fondodeinicio.png"
        alt="Moscow Mule"
        class="hero-image"
      />
    </section>

    <!-- ================ CONCIERTOS ================= -->

<!-- ============================= -->
<!--       SECCIÓN CONCIERTOS     -->
<!-- ============================= -->
<section class="conciertos-section">

  <!-- Título -->
  <div class="titulo-conciertos-wrap">
    <img src="conciertos.png" alt="Conciertos" class="titulo-conciertos-img">
  </div>

  <!-- CONTENEDOR COMPLETO -->
  <div class="conciertos-container">

    <!-- Palmera izquierda -->
    <img src="palmeraizquierda.png" class="concierto-palmera palmera-left" alt="Palmera">

    <!-- Galería 3 imágenes -->
    <div class="conciertos-gallery" id="conciertosGallery">

      <!-- Izquierda -->
      <div class="concierto-card pos-left">
        <img src="concierto1.png" alt="Poster 1">
      </div>

      <!-- Centro -->
      <div class="concierto-card pos-center">
        <img src="concierto2.png" alt="Poster 2">
      </div>

      <!-- Derecha -->
      <div class="concierto-card pos-right">
        <img src="concierto3.png" alt="Poster 3">
      </div>

    </div>

    <!-- Palmera derecha -->
    <img src="palmeraderecha.png" class="concierto-palmera palmera-right" alt="Palmera">

<!-- FLORES DECORATIVAS ABAJO IZQUIERDA -->
<img src="floresizquierdas.png" alt="Flores izquierda" class="flores-izquierda">

<!-- FLORES DECORATIVAS ABAJO DERECHA -->
<img src="floresderechas.png" alt="Flores derecha" class="flores-derecha">

  </div>


  <!-- Flechas -->
  <div class="conciertos-arrows">
    <button id="btnConPrev" class="conciertos-arrow">
      <img src="flechaizquierda.png" alt="Anterior">
    </button>

    <button id="btnConNext" class="conciertos-arrow">
      <img src="flechaderecha.png" alt="Siguiente">
    </button>
  </div>

</section>

    <!-- ================= MERCH PREVIEW ================= -->

<section class="merch-section" id="merch">

  <!-- TÍTULO COMO IMAGEN -->
  <div class="merch-title-wrap">
    <img src="merch.png" alt="Merch" class="merch-title-img">
  </div>

  <!-- CONTENIDO CENTRAL -->
  <div class="merch-center">

    <!-- Flecha izquierda -->
    <button class="merch-arrow-btn" id="btnMerchPrev">
      <img src="flechaizquierda.png" alt="Anterior">
    </button>

    <!-- Imagen izquierda -->
    <div class="merch-card">
      <img src="polera1.png" alt="Producto izquierdo">
    </div>

    <!-- CORAZÓN -->
    <div class="merch-heart-wrap">
      <img src="corazon.png" alt="Corazón" class="merch-heart-img">
    </div>

    <!-- Imagen derecha -->
    <div class="merch-card">
      <img src="polera2.png" alt="Producto derecho">
    </div>

    <!-- Flecha derecha -->
    <button class="merch-arrow-btn" id="btnMerchNext">
      <img src="flechaderecha.png" alt="Siguiente">
    </button>
  </div>

 <!-- Piso horizontal detrás del corazón -->
<div class="merch-floor">
  <img src="piso.png" alt="Piso" class="merch-floor-img">
  </div>

  <!-- BOTÓN MÁS -->
  <div class="merch-more-wrap">
    <a href="merch.html">
      <img src="mas.png" alt="Más" class="merch-more-img">
    </a>
</div>
</section>

<!-- ================= ÚNETE ================= -->
<section class="unete-section" id="unete">

  <!-- TÍTULO ÚNETE COMO IMAGEN -->
  <div class="unete-title-wrap">
    <img src="unete.png" alt="Únete" class="unete-title-img">
  </div>

  <!-- SOL COMO IMAGEN -->
  <div class="unete-sun-wrap">
    <img src="sol.png" alt="Sol" class="unete-sun-img">
  </div>

  <!-- FORMULARIO ENCIMA DEL SOL -->
  <div class="unete-form-wrap">
    <form class="unete-form">

      <div class="unete-field">
        <label for="mail">MAIL:</label>
        <input type="email" id="mail" name="mail">
      </div>

      <div class="unete-field">
        <label for="pais">PAÍS:</label>
        <input type="text" id="pais" name="pais">
      </div>

      <div class="unete-field">
        <label for="cp">COD. POSTAL:</label>
        <input type="text" id="cp" name="cp">
      </div>

    </form>
  </div>
</section>
